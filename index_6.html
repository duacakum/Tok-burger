<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">

<title>Tok Burger</title>
<style>

.seg{display:flex;border:1px solid var(--ln);border-radius:2px}

input:not([type=checkbox]){width:100%;padding:18px 16px;background:var(--s1);border:1px solid var(--ln);border-radius:2px;font:inherit;color:var(--tx)}

.note{margin:0 22px;color:var(--mu);font-size:13px}

.pay{width:100%;padding:19px;margin:0}

.sheet .btn{width:100%;margin-top:18px;display:flex;justify-content:space-between;padding:17px 20px}

.tbn{display:none;margin:18px 22px 0;padding:16px 18px;border:1px solid var(--ln);border-left:3px solid var(--ac);background:var(--s1);gap:14px;align-items:flex-start}

.gh{margin:24px 0 12px}

.dl{padding-bottom:26px;-webkit-mask-image:linear-gradient(#000 calc(100% - 22px),transparent);mask-image:linear-gradient(#000 calc(100% - 22px),transparent)}
