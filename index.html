function show(id){["s1","s2","s3","s4","s5"].forEach(function(s){$("#"+s).classList.toggle("hide",s!=id)});upd();stopScroll();$("#scr").scrollTop=0;window.scrollTo(0,0)}
function upd(){var n=count();$("#cb").classList.toggle("hide",!n||$("#s2").classList.contains("hide"));$("#cc").textContent="Корзина · "+n;$("#ct").textContent=fmt(total())}
function select(id,scroll){cur=LOCATIONS.filter(function(l){return l.id==id})[0];
 document.querySelectorAll(".dot").forEach(function(d){d.classList.toggle("sel",d.dataset.id==id)});
 document.querySelectorAll(".loc").forEach(function(d){d.classList.toggle("sel",d.dataset.id==id)});
 moveBar(id);if(scroll)document.querySelector('.loc[data-id="'+id+'"]').scrollIntoView({behavior:"smooth",block:"center"})}
function build(){var g=$("#dots"),h="";
 LOCATIONS.forEach(function(l){g.insertAdjacentHTML("beforeend",'<g class="dot" data-id="'+l.id+'"><circle class="glow" cx="'+l.x+'" cy="'+l.y+'" r="18"/><circle class="halo" cx="'+l.x+'" cy="'+l.y+'" r="9"/><circle class="core" cx="'+l.x+'" cy="'+l.y+'" r="8"/></g>');
 h+='<div class="loc" data-id="'+l.id+'"><b>'+l.n+'</b><p>г. Алматы, '+l.a+'</p><p>Доставка '+FEE+' KZT · 35–45 мин</p><button class="btn" data-go="'+l.id+'">Заказать здесь</button></div>'});
 $("#locs").innerHTML=h+"<i class='lbar' id='lbar'></i>";
 document.querySelectorAll(".dot").forEach(function(d){d.onclick=function(){select(+d.dataset.id,true)}});
 document.querySelectorAll("[data-go]").forEach(function(b){b.onclick=function(){var id=+b.dataset.go;if(cur.id!=id&&count())cart={};select(id);openMenu()}});
 $("#ic-pin").innerHTML=ICON.pin;
 ["b","c"].forEach(function(p){$("#"+p+"-d").innerHTML=ICON.bike+" Доставка";$("#"+p+"-p").innerHTML=ICON.walk+" С собой"})}
function openMenu(){$("#mname").textContent=cur.n;$("#mdel").textContent="Доставка "+FEE+" KZT";renderMenu();show("s2")}
function renderMenu(){var h="";MENU.forEach(function(g){h+="<h4>"+g.c+"</h4>";g.i.forEach(function(i){var q=cart[i.id]||0;
 h+='<div class="item"><div class="t"><h3>'+i.n+'</h3><p>'+i.d+'</p><span class="price">'+fmt(i.p)+'</span></div><div class="img">'+ICON[i.e]+(q?'<div class="qty"><button data-m="'+i.id+'">−</button>'+q+'<button data-p="'+i.id+'">+</button></div>':'<button class="add" data-p="'+i.id+'">+</button>')+'</div></div>'})});
 $("#menu").innerHTML=h;
 document.querySelectorAll("[data-p]").forEach(function(b){b.onclick=function(){cart[b.dataset.p]=(cart[b.dataset.p]||0)+1;renderMenu();upd()}});
 document.querySelectorAll("#menu [data-m]").forEach(function(b){b.onclick=function(){var k=b.dataset.m;cart[k]--;if(!cart[k])delete cart[k];renderMenu();upd()}})}
function renderSum(){var h="";for(var k in cart){var i=find(k);h+="<div><span>"+cart[k]+" × "+i.n+"</span><span>"+fmt(i.p*cart[k])+"</span></div>"}
 var f=mode=="d"?FEE:0;h+="<div><span>Доставка</span><span>"+fmt(f)+"</span></div><div class='tot'><span>Итого</span><span>"+fmt(total()+f)+"</span></div>";$("#sum").innerHTML=h}
function setMode(m){mode=m;document.querySelectorAll("#mode1 button,#mode3 button").forEach(function(b){b.classList.toggle("on",b.dataset.m==m)});$("#addrw").classList.toggle("hide",m!="d")}
document.querySelectorAll("#mode1 button,#mode3 button").forEach(function(b){b.onclick=function(){setMode(b.dataset.m);renderSum()}});
$("#back1").onclick=function(){show("s1")};
$("#home").onclick=function(e){e.preventDefault();show("s1")};
function fitPhone(){$("#phone").style.zoom=innerWidth>520?Math.min(1,(innerHeight-32)/876):1}
fitPhone();addEventListener("resize",fitPhone);
function moveBar(id){var c=document.querySelector('.loc[data-id="'+id+'"]'),b=$("#lbar");if(!c||!b||!c.offsetHeight)return;b.style.height=c.offsetHeight+"px";b.style.transform="translateY("+c.offsetTop+"px)"}
var ticking=false;
function onScr(){if(ticking)return;ticking=true;requestAnimationFrame(function(){ticking=false;if($("#s1").classList.contains("hide"))return;
 var r=innerWidth>520?$("#scr").getBoundingClientRect():{top:0,height:innerHeight},mid=r.top+r.height*.5,best=null,bd=1e9,lb=$("#locs").getBoundingClientRect();
 if(lb.top>mid||lb.bottom<mid)return;
 document.querySelectorAll(".loc").forEach(function(c){var b=c.getBoundingClientRect(),d=Math.abs(b.top+b.height/2-mid);if(d<bd){bd=d;best=c}});
 if(best&&+best.dataset.id!=cur.id)select(+best.dataset.id)})}
$("#scr").addEventListener("scroll",onScr,{passive:true});addEventListener("scroll",onScr,{passive:true});
var sc=$("#scr"),tgt=0,cu=0,anim=0;
function stopScroll(){cancelAnimationFrame(anim);anim=0}
var ORDER_ENDPOINT='https://tokburger-orders.duac-akum.workers.dev';
function sendOrder(num){if(!ORDER_ENDPOINT)return;var items=[];for(var k in cart){var it=find(k);items.push({name:it.n,qty:cart[k],price:it.p})}
 var body={number:num,point:cur.n,address:cur.a,mode:mode=='d'?'Доставка':'С собой',name:($('#fn').value+' '+$('#ln').value).trim(),phone:'+7 '+$('#tel').value.trim(),email:$('#em').value.trim(),deliveryAddress:$('#addr').value.trim(),items:items,total:total()+(mode=='d'?FEE:0)};
 try{fetch(ORDER_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).catch(function(){})}catch(e){}}
function step(){cu+=(tgt-cu)*.07;if(Math.abs(tgt-cu)<.5){cu=tgt;sc.scrollTop=cu;anim=0;return}sc.scrollTop=cu;anim=requestAnimationFrame(step)}
sc.addEventListener("wheel",function(e){if(e.ctrlKey||e.target.closest(".map"))return;e.preventDefault();if(!anim){cu=sc.scrollTop;tgt=cu}tgt=Math.max(0,Math.min(sc.scrollHeight-sc.clientHeight,tgt+e.deltaY*.5));if(!anim)anim=requestAnimationFrame(step)},{passive:false});
$("#back2").onclick=function(){show("s2")};
$("#cbtn").onclick=function(){$("#pname").textContent="Tok Burger · "+cur.n;renderSum();show("s3")};
$("#pay").onclick=function(){var need=["fn","tel"].concat(mode=="d"?["addr"]:[]),bad=false;
 ["fn","ln","em","tel","addr"].forEach(function(i){$("#"+i).classList.remove("err")});
 need.forEach(function(i){if(!$("#"+i).value.trim()){$("#"+i).classList.add("err");bad=true}});
 if(bad)return;
 startTrack()};
build();select(LOCATIONS[0].id);
var M=$("#map"),S=$("#svg"),z=1,cx=200,cy=170,ptr={},moved=0,lastD=0;
function apply(){var w=400/z,h=340/z;cx=Math.max(w/2,Math.min(400-w/2,cx));cy=Math.max(h/2,Math.min(340-h/2,cy));
 S.setAttribute("viewBox",(cx-w/2)+" "+(cy-h/2)+" "+w+" "+h);
 LOCATIONS.forEach(function(l){document.querySelector('.dot[data-id="'+l.id+'"]').setAttribute("transform","translate("+l.x+" "+l.y+") scale("+(1/z)+") translate("+(-l.x)+" "+(-l.y)+")")})}
function zoomBy(f){z=Math.max(1,Math.min(5,z*f));apply()}
function upp(){var r=S.getBoundingClientRect();return 1/Math.max(r.width/(400/z),r.height/(340/z))}
$("#zi").onclick=function(){zoomBy(1.5)};$("#zo").onclick=function(){zoomBy(1/1.5)};
M.addEventListener("wheel",function(e){e.preventDefault();zoomBy(e.deltaY<0?1.2:1/1.2)},{passive:false});
M.addEventListener("pointerdown",function(e){ptr[e.pointerId]={x:e.clientX,y:e.clientY};moved=0;lastD=0});
M.addEventListener("pointermove",function(e){var p=ptr[e.pointerId];if(!p)return;var ids=Object.keys(ptr);
 if(ids.length==1){var u=upp(),dx=e.clientX-p.x,dy=e.clientY-p.y;cx-=dx*u;cy-=dy*u;moved+=Math.abs(dx)+Math.abs(dy);p.x=e.clientX;p.y=e.clientY;apply()}
 else{p.x=e.clientX;p.y=e.clientY;var a=ptr[ids[0]],b=ptr[ids[1]],d=Math.hypot(a.x-b.x,a.y-b.y);if(lastD)zoomBy(d/lastD);lastD=d;moved+=10}});
["pointerup","pointercancel","pointerleave"].forEach(function(t){M.addEventListener(t,function(e){delete ptr[e.pointerId];lastD=0})});
M.addEventListener("click",function(e){if(moved>6){e.stopPropagation();e.preventDefault();moved=0}},true);

var STEPS=[
{n:'Заказ принят',s:'Принят',d:'Мы получили заказ и передали его на кухню.'},
{n:'Готовим',s:'Гриль',d:'Котлеты на гриле, булочки подрумяниваются.'},
{n:'Собираем',s:'Сборка',d:'Собираем бургеры, кладём фри и напитки в пакет.'},
{n:'Курьер в пути',s:'Доставка',d:'Курьер забрал заказ и едет к вам.'},
{n:'Доставлен',s:'Готово',d:'Приятного аппетита!'}];
var DUR=[3500,7000,6000,9000],PL=[[0,1],[1.7,0],[3.4,1],[5.1,0],[6.8,1]],TK={i:0,t0:0,sel:null,st:null,pts:[],raf:0,eta:40};
function pr(p){return[(p[0]-p[1])*43.5,(p[0]+p[1])*25]}
function cube(x,y,w,h){var a=w/2;return `<polygon class='tp' points='${x},${y-a} ${x+w},${y} ${x},${y+a} ${x-w},${y}'/><polygon class='lf' points='${x-w},${y} ${x},${y+a} ${x},${y+a+h} ${x-w},${y+h}'/><polygon class='rt' points='${x},${y+a} ${x+w},${y} ${x+w},${y+h} ${x},${y+a+h}'/>`}
function startTrack(){
 TK.st=STEPS.map(function(s){return Object.assign({},s)});
 if(mode=='p'){TK.st[3]={n:'Готов к выдаче',s:'Выдача',d:'Заказ ждёт вас на кассе.'};TK.st[4]={n:'Выдан',s:'Готово',d:'Приятного аппетита!'}}
 TK.eta=mode=='d'?40:15;TK.i=0;TK.t0=performance.now();TK.sel=null;
 var num=1000+Math.floor(Math.random()*9000);sendOrder(num);
 $('#tsub').textContent='Заказ № '+num+' · '+cur.n+' · '+fmt(total()+(mode=='d'?FEE:0));
 cart={};upd();drawStage();paint();show('s5');cancelAnimationFrame(TK.raf);TK.raf=requestAnimationFrame(loop)}
function drawStage(){var W=36,H=12,pts=PL.map(pr),xs=pts.map(function(p){return p[0]}),ys=pts.map(function(p){return p[1]});
 TK.pts=pts;var x0=Math.min.apply(0,xs)-W-16,x1=Math.max.apply(0,xs)+W+16,y0=Math.min.apply(0,ys)-W/2-40,y1=Math.max.apply(0,ys)+W/2+H+16;
 var d=pts.map(function(p,i){return(i?'L':'M')+p[0]+' '+p[1]}).join('');
 var h=`<path class='belt' d='${d}'/><path class='beltl' d='${d}'/>`;
 pts.forEach(function(p,i){h+=`<g class='st' data-i='${i}'>${cube(p[0],p[1],W,H)}<text x='${p[0]}' y='${p[1]-W/2-10}'>0${i+1} ${TK.st[i].s.toUpperCase()}</text></g>`});
 h+=`<g class='pk' id='pk'></g>`;
 var s=$('#tsvg');s.setAttribute('viewBox',x0+' '+y0+' '+(x1-x0)+' '+(y1-y0));s.innerHTML=h;
 s.querySelectorAll('.st').forEach(function(g){g.onclick=function(){TK.sel=+g.dataset.i;paint()}})}
function paint(){var i=TK.i,k=TK.sel==null?i:TK.sel;
 document.querySelectorAll('#tsvg .st').forEach(function(g,j){g.setAttribute('class','st'+(j<i?' done':'')+(j==i?' now':'')+(TK.sel===j?' sel':''))});
 $('#tt').textContent=TK.st[i].n;
 $('#tcard').innerHTML=`<small>${k==i?'Текущий этап':k<i?'Завершён':'Далее'}</small><br><b>${TK.st[k].n}</b><p>${TK.st[k].d}</p>`;
 $('#tsteps').innerHTML=TK.st.map(function(s,j){var c=j<i||i==4?'done':j==i?'now':'';return `<div class='ts ${c}'><i>${c=='done'?'✓':j+1}</i><span>${s.n}</span><em>${c=='done'?'готово':c=='now'?'сейчас':'—'}</em></div>`}).join('')}
function loop(now){var i=TK.i,el=now-TK.t0;
 while(i<4&&el>=DUR[i]){TK.t0+=DUR[i];el-=DUR[i];i++;TK.i=i;paint()}
 var f=i<4?el/DUR[i]:0,m=Math.min(1,Math.max(0,(f-.3)/.7));m=m*m*(3-2*m);
 var a=TK.pts[i],b=TK.pts[Math.min(4,i+1)],x=a[0]+(b[0]-a[0])*m,y=a[1]+(b[1]-a[1])*m-22-Math.sin(now/280)*3;
 $('#pk').innerHTML=cube(x,y,9,9);
 var p=Math.min(1,(i+f)/4);$('#tbar').style.width=p*100+'%';$('#tpct').textContent=Math.round(p*100)+'%';
 $('#teta').textContent=i==4?(mode=='d'?'Доставлен':'Выдан'):'Осталось ~'+Math.max(1,Math.ceil((1-p)*TK.eta))+' мин';
 if(!$('#s5').classList.contains('hide'))TK.raf=requestAnimationFrame(loop)}
</script></body></html>
